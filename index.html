<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aanya & Vihaan – Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
:root{--maroon:#4a0a17;--wine:#7a1428;--rose:#a3203a;--gold:#d8b76a;--gold2:#f1dc9e;--ivory:#fbf4e4;--ink:#3a0b14;
--serif:'Cormorant Garamond',Georgia,serif;--script:'Pinyon Script','Snell Roundhand',cursive;--cap:'Cinzel',Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--maroon);color:var(--ivory);font-family:var(--serif);font-size:19px;line-height:1.6;overflow-x:hidden}
body.lock{overflow:hidden;height:100%}
button{font:inherit;cursor:pointer}
a{color:inherit}
section{position:relative;padding:84px 22px;text-align:center;overflow:hidden}
.dark{background:radial-gradient(120% 80% at 50% 0%,#7a1428 0%,#4a0a17 60%,#33060f 100%)}
.light{background:var(--ivory);color:var(--ink);background-image:radial-gradient(circle at 50% 0,#fff 0,transparent 60%)}
.frame{position:relative;max-width:520px;margin:0 auto;padding:46px 26px;border:1px solid var(--gold)}
.frame::before{content:"";position:absolute;inset:6px;border:1px solid rgba(216,183,106,.45);pointer-events:none}
.frame i{position:absolute;width:34px;height:34px;color:var(--gold)}
.frame i:nth-child(1){top:-2px;left:-2px}.frame i:nth-child(2){top:-2px;right:-2px;transform:scaleX(-1)}
.frame i:nth-child(3){bottom:-2px;left:-2px;transform:scaleY(-1)}.frame i:nth-child(4){bottom:-2px;right:-2px;transform:scale(-1)}
.script{font-family:var(--script);font-weight:400;color:var(--gold);line-height:1.1}
.light .script{color:var(--wine)}
h2{font-family:var(--script);font-weight:400;font-size:clamp(40px,12vw,58px);margin:6px 0 4px;color:var(--gold)}
.light h2{color:var(--wine)}
.cap{font-family:var(--cap);letter-spacing:.14em;font-size:.72em;color:var(--gold)}
.light .cap{color:var(--wine)}
.orn{display:block;margin:14px auto;width:170px;color:var(--gold)}
.light .orn{color:#b8923e}
p{margin:.5em 0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:40px;border:1px solid var(--gold);background:linear-gradient(135deg,#f1dc9e,#c9a24e);color:var(--maroon);font-family:var(--cap);font-size:.68em;letter-spacing:.1em;text-decoration:none;box-shadow:0 6px 22px rgba(0,0,0,.28);transition:transform .25s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--gold)}
.light .btn.ghost{color:var(--wine);border-color:var(--wine)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}

/* envelope */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow-y:auto;padding:20px 0;background:radial-gradient(90% 70% at 50% 40%,#7a1428,#2a050c);transition:opacity 1.2s,visibility 1.2s}
#intro.done{opacity:0;visibility:hidden}
#intro .hint{font-family:var(--script);font-size:34px;color:var(--gold);text-align:center;padding:0 20px}
.stage{perspective:1000px}
.env{position:relative;width:min(84vw,340px);aspect-ratio:1.45;background:#8c1a2e;border-radius:4px;box-shadow:0 30px 60px rgba(0,0,0,.55);animation:float 4s ease-in-out infinite}
.opened .env{animation:none}
@keyframes float{50%{transform:translateY(-8px)}}
.env .card{position:absolute;left:6%;right:6%;top:6%;bottom:6%;background:var(--ivory);color:var(--maroon);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:-6px;transition:transform 1.1s .7s cubic-bezier(.3,.7,.2,1),z-index 0s .9s;z-index:1}
.opened .card{transform:translateY(-62%) scale(1.04);z-index:5}
.card b{font-family:var(--script);font-weight:400;font-size:30px;color:var(--wine)}
.card small{font-family:var(--cap);font-size:10px;letter-spacing:.2em}
.pocket{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(#a3203a,#a3203a);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);opacity:.0}
.pocket::before,.pocket::after{content:"";position:absolute;inset:0}
.pocket::before{background:#9a1c34;clip-path:polygon(0 0,52% 56%,0 100%)}
.pocket::after{background:#7d1327;clip-path:polygon(0 100%,50% 52%,100% 100%)}
.pocket{opacity:1;background:#8c1a2e;clip-path:polygon(0 0,0 100%,100% 100%,100% 0,50% 56%)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(#b0253f,#8c1a2e);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s cubic-bezier(.5,0,.2,1),z-index 0s .45s;z-index:4;backface-visibility:visible}
.opened .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:58%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;z-index:6;border:0;background:radial-gradient(circle at 35% 30%,#f7e5a8,#c9a24e 60%,#8d6a20);color:var(--maroon);font-family:var(--script);font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:opacity .4s,transform .4s;animation:pulse 2s infinite}
.opened .seal{opacity:0;transform:scale(1.6);animation:none;pointer-events:none}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(216,183,106,.18)}}

/* hero */
#hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding-bottom:110px}
#hero .names{font-size:clamp(54px,17vw,92px);display:block}
#hero .and{font-size:clamp(30px,9vw,44px);color:var(--gold2);display:block;margin:-6px 0}
.pre #hero .reveal-n,.pre #hero .reveal-t{opacity:0}
.go .reveal-n{animation:nm 2s cubic-bezier(.2,.7,.2,1) both}
.go .reveal-n:nth-of-type(2){animation-delay:.5s}.go .and{animation-delay:.3s!important}
.go .reveal-t{animation:fade 1.6s 1.4s both}
@keyframes nm{from{opacity:0;filter:blur(14px);letter-spacing:.25em;transform:scale(1.08)}to{opacity:1;filter:blur(0);letter-spacing:0;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scrollcue{display:block;margin:30px auto 0;width:22px;height:36px;border:1px solid var(--gold);border-radius:12px;position:relative}
.scrollcue::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:7px;margin-left:-1.5px;background:var(--gold);border-radius:2px;animation:sc 1.6s infinite}
@keyframes sc{to{transform:translateY(12px);opacity:0}}

/* couple */
.couple{display:grid;gap:34px;max-width:520px;margin:30px auto 0}
.person .ph{width:min(70vw,260px);aspect-ratio:3/4;margin:0 auto 16px;border:1px solid var(--gold);padding:8px;border-radius:130px 130px 6px 6px}
.ph img,.g img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.rv{clip-path:inset(0 0 100% 0);transition:clip-path 1.5s cubic-bezier(.6,0,.2,1)}
.rv.in{clip-path:inset(0)}
.person h3{font-family:var(--script);font-weight:400;font-size:44px;margin:0;color:var(--wine)}
.person small{display:block;opacity:.8}

/* countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:440px;margin:26px auto 0}
.cd div{border:1px solid var(--gold);padding:16px 4px 10px;background:rgba(0,0,0,.18)}
.cd b{display:block;font-family:var(--cap);font-weight:500;font-size:clamp(26px,8vw,38px);color:var(--gold2);font-variant-numeric:tabular-nums}
.cd span{font-size:.7em;opacity:.85}

/* events */
.ev .big{font-size:clamp(34px,10vw,46px);font-family:var(--serif);font-weight:600;margin:0}
.ev .hi{font-size:1.1em;color:var(--gold)}
.light .ev .hi{color:var(--wine)}
.ev .ico{font-size:40px;display:block;margin-bottom:4px}
.meta{margin:18px 0;display:grid;gap:4px}
.meta strong{font-family:var(--cap);font-weight:500;letter-spacing:.08em;font-size:.82em}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:560px;margin:28px auto 0}
.g{aspect-ratio:1;border:0;padding:6px;background:transparent;border:1px solid var(--gold);cursor:zoom-in}
.g:nth-child(1),.g:nth-child(4){grid-row:span 1}
.g img{transition:transform .6s}.g:hover img{transform:scale(1.05)}
#lb{position:fixed;inset:0;z-index:90;background:rgba(20,2,6,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:72vh;border:1px solid var(--gold);padding:6px;background:var(--maroon)}
#lb .row{margin:0}

/* map & rsvp */
.mapcard{max-width:520px;margin:26px auto 0;aspect-ratio:16/10;border:1px solid var(--gold);padding:6px;position:relative}
.mapcard svg{width:100%;height:100%;display:block}
form{max-width:480px;margin:26px auto 0;text-align:left;display:grid;gap:14px}
label{font-family:var(--cap);font-size:.7em;letter-spacing:.1em;color:var(--gold)}
input[type=text],input[type=number],textarea{width:100%;margin-top:6px;padding:12px 14px;background:rgba(0,0,0,.25);border:1px solid var(--gold);color:var(--ivory);font:inherit;border-radius:2px}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips label{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:.9em;letter-spacing:0;color:var(--ivory);border:1px solid rgba(216,183,106,.6);padding:7px 12px;border-radius:30px}
.chips input{accent-color:var(--gold)}

/* bottom nav + music */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(30,4,10,.92) 45%);transform:translateY(120%);transition:transform .8s 1s;scrollbar-width:none}
.go #nav{transform:none}
#nav::-webkit-scrollbar{display:none}
#nav a{flex:none;text-decoration:none;font-size:.78em;padding:7px 14px;border-radius:30px;background:rgba(74,10,23,.85);border:1px solid rgba(216,183,106,.55);color:var(--gold2);white-space:nowrap}
#nav a.act{background:var(--gold);color:var(--maroon)}
#mus{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:60;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:rgba(74,10,23,.8);color:var(--gold2);font-size:20px;display:none}
.go #mus,.opened #mus{display:block}
#mus.on{animation:pulse 2.4s infinite}
#intro .tap{animation:tapg 1.8s ease-in-out infinite;padding:14px 26px}
@keyframes tapg{0%,100%{box-shadow:0 6px 22px rgba(0,0,0,.28),0 0 0 0 rgba(216,183,106,.55)}50%{box-shadow:0 6px 22px rgba(0,0,0,.28),0 0 0 14px rgba(216,183,106,0)}}
.how{list-style:none;margin:0;padding:0 20px;max-width:340px;text-align:center;font-size:.82em;line-height:1.45;color:var(--gold2);display:grid;gap:5px}
.arrow{display:block;width:14px;height:14px;margin:6px auto 0;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(8px) rotate(45deg);opacity:.35}}
#pl{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));right:14px;z-index:60;width:min(86vw,300px);padding:16px;background:rgba(51,6,15,.97);border:1px solid var(--gold);display:none;text-align:left;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#pl.on{display:block}
#pl p{margin:0 0 10px;font-size:.82em;line-height:1.4}
.tk{display:block;width:100%;text-align:left;margin-bottom:6px;padding:9px 12px;background:transparent;border:1px solid rgba(216,183,106,.45);color:var(--ivory);font-size:.9em}
.tk[aria-pressed=true]{background:rgba(216,183,106,.18);border-color:var(--gold);color:var(--gold2)}
#pl .row{margin-top:10px;gap:8px;justify-content:flex-start}#pl .btn{padding:10px 18px;cursor:pointer}
#vl{width:100%;accent-color:#d8b76a;margin-top:12px}
.att{border:0;padding:0;margin:0;display:grid;gap:10px}
.opt{position:relative;display:block;font-family:var(--serif);font-size:1em;letter-spacing:0;color:var(--ivory);cursor:pointer}
.opt input{position:absolute;opacity:0}
.opt span{display:block;text-align:center;padding:14px 10px;border:1px solid rgba(216,183,106,.6);background:rgba(0,0,0,.2);transition:background .3s,color .3s}
.opt input:checked+span{background:linear-gradient(135deg,#f1dc9e,#c9a24e);color:var(--maroon);border-color:var(--gold);font-weight:600}
.opt input:focus-visible+span{outline:2px solid var(--gold2);outline-offset:3px}
.btn.wa{padding:15px 28px;font-size:.74em;animation:tapg 2.2s ease-in-out infinite}
#mh{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));right:68px;z-index:60;padding:6px 12px;background:var(--gold);color:var(--maroon);border-radius:20px;font-size:.78em;opacity:0;pointer-events:none}
.hintshow #mh{animation:mh 8s 2.8s both}
@keyframes mh{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.thanks{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding-bottom:110px}
.thanks h2{font-size:clamp(54px,17vw,84px)}
.sr{position:absolute;left:-9999px}
@media (min-width:700px){.couple{grid-template-columns:1fr 1fr}.gal{grid-template-columns:repeat(3,1fr)}body{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}html{scroll-behavior:auto}.rv{clip-path:none}}
</style>
</head>
<body class="lock pre">

<canvas id="fx" aria-hidden="true"></canvas>
<button id="mus" aria-label="Open music player" aria-expanded="false">♪</button>
<div id="mh">Tap ♪ for wedding music</div>
<div id="pl" role="group" aria-label="Wedding music player"><p class="cap">Wedding Music</p><p id="plh">Choose a song, then tap Play. Music stays on while you scroll.</p><div id="tl"></div><div class="row"><button class="btn" id="pp">Play</button><button class="btn ghost" id="mt">Mute</button></div><input type="range" id="vl" min="0" max="100" aria-label="Volume"></div>

    <div class="card"><small id="eT">THE WEDDING OF</small><b id="eN"></b><small id="eD"></small></div>

</div>

<main id="app"></main>
<nav id="nav" aria-label="Jump to section"></nav>

const img=(url,i,l,alt)=>`<img src="${esc(url||ph(i,l))}" alt="${esc(alt)}" loading="lazy" decoding="async">`;

const corners=`<i><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 32V10C2 5 5 2 10 2h22M8 32V14c0-4 2-6 6-6h18M14 2c0 6-4 8-8 8"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></i>`.repeat(4);
const orn=`<svg class="orn" viewBox="0 0 170 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 12h54M112 12h54"/><path d="M85 3c6 4 6 14 0 18-6-4-6-14 0-18zM85 12c-8-2-14 0-20 5 8 3 15 1 20-5zM85 12c8-2 14 0 20 5-8 3-15 1-20-5z" fill="currentColor" fill-opacity=".25"/><circle cx="62" cy="12" r="2" fill="currentColor"/><circle cx="108" cy="12" r="2" fill="currentColor"/></svg>`;

function build(){
 const b=C.bride,g=C.groom,w=C.weddingDate;
 const evSecs=C.events.map(e=>{
  const cal=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.title+' – '+b.name+' & '+g.name)}&dates=${e.start.replace(/[-:]/g,'')}00/${e.end.replace(/[-:]/g,'')}00&location=${encodeURIComponent(e.venue+', '+e.address)}&ctz=Asia/Kolkata`;
  return `<section id="${e.id}" class="ev ${e.dark?'dark':'light'}"><div class="frame">${corners}
   <span class="ico">${e.icon}</span><h2>${esc(e.title)}</h2><div class="hi">${esc(e.hi)}</div>${orn}
   <p class="big">${fmtD(e.start,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
   <p class="cap">${fmtT(e.start)} onwards</p>
   <div class="meta"><strong>${esc(e.venue)}</strong><span>${esc(e.address)}</span><span><em>Dress code: ${esc(e.dress)}</em></span></div>
   <p>${esc(e.note)}</p>
   <div class="row"><a class="btn" target="_blank" rel="noopener" href="${gmaps(e.venue+' '+e.map)}">Get Directions</a><a class="btn ghost" target="_blank" rel="noopener" href="${cal}">Add to Calendar</a></div>
  </div></section>`}).join('');
 const chips=C.events.map(e=>`<label><input type="checkbox" name="ev" value="${esc(e.title)}" checked> ${esc(e.title)}</label>`).join('');
 
 $('#app').innerHTML=`
 <section id="hero" class="dark"><div>
  <p class="cap reveal-t">${esc(C.tagline)}</p>
  <h1 style="margin:14px 0 0;font-weight:400"><span class="script names reveal-n">${esc(b.name)}</span><span class="script and reveal-n">&amp;</span><span class="script names reveal-n">${esc(g.name)}</span></h1>
  <div class="reveal-t">${orn}<p style="max-width:380px;margin:0 auto">${esc(C.invite)}</p>
  <p class="cap" style="margin-top:18px">${fmtD(w,{day:'numeric',month:'long',year:'numeric'})}</p><p class="cap" style="margin-top:22px;font-size:.62em">Scroll down to explore all wedding events</p><span class="scrollcue" aria-hidden="true"></span><span class="arrow" aria-hidden="true"></span></div>
 </div></section>

 <section id="couple" class="light"><h2>The Couple</h2>${orn}<p>Two families, one beautiful beginning.</p>
  <div class="couple">
   <div class="person">${b.photo?`<div class="ph rv">${img(b.photo,0,b.name,'Photo of '+b.name)}</div>`:''}<h3>${esc(b.full)}</h3><small>${esc(b.parents)}</small><p>${esc(b.about)}</p></div>
   <div class="person">${g.photo?`<div class="ph rv">${img(g.photo,1,g.name,'Photo of '+g.name)}</div>`:''}<h3>${esc(g.full)}</h3><small>${esc(g.parents)}</small><p>${esc(g.about)}</p></div>
  </div></section>

 <section id="countdown" class="dark"><h2>Counting the Days</h2>${orn}<p>Until we say “I do”</p>
  <div class="cd" id="cd" aria-live="off"><div><b id="cdd">00</b><span>Days</span></div><div><b id="cdh">00</b><span>Hours</span></div><div><b id="cdm">00</b><span>Minutes</span></div><div><b id="cds">00</b><span>Seconds</span></div></div>
  <p id="cdmsg" class="script" style="font-size:34px;margin-top:22px"></p></section>

 ${evSecs}

 

 <section id="venue" class="light"><h2>Find the Venue</h2>${orn}
  <p><strong>${esc(C.events.find(e=>e.id==='wedding').venue)}</strong><br>${esc(C.events.find(e=>e.id==='wedding').address)}</p>
  <div class="mapcard"><svg viewBox="0 0 320 200" role="img" aria-label="Map preview"><rect width="320" height="200" fill="#efe3c6"/><g stroke="#d8b76a" stroke-width="6" fill="none" opacity=".8"><path d="M-10 150C80 120 120 170 200 110S300 60 340 80"/><path d="M60 -10C80 60 130 90 120 210"/><path d="M230 -10c-10 70 20 120 60 220"/></g><g stroke="#fff" stroke-width="2" opacity=".7"><path d="M0 60h320M0 110h320M170 0v200"/></g><path d="M160 150c-22-34-34-48-34-66a34 34 0 1168 0c0 18-12 32-34 66z" fill="#7a1428"/><circle cx="160" cy="84" r="12" fill="#f1dc9e"/></svg></div>
  <div class="row"><a class="btn" target="_blank" rel="noopener" href="${gmaps(C.mainVenueMap)}">Open in Google Maps</a><a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(C.mainVenueMap)}">View on Map</a></div></section>

 <section id="rsvp" class="dark"><div class="frame">${corners}<h2>RSVP</h2>${orn}<p>Please let us know you are coming. Your reply opens in WhatsApp.</p>
  <form id="rf"><label>Your name (optional)<input type="text" id="rn" autocomplete="name" placeholder="e.g. Rohan Mehta"></label>
   <fieldset class="att"><legend class="sr">Will you attend?</legend>
    <label class="opt"><input type="radio" name="att" value="yes" checked><span>Yes, I will attend</span></label>
    <label class="opt"><input type="radio" name="att" value="no"><span>Sorry, I cannot attend</span></label></fieldset>
   <div id="evb"><label>Events you will attend</label><div class="chips">${chips}</div></div>
   <label>Message for the couple (optional)<textarea id="rm" placeholder="Wishing you a lifetime of love"></textarea></label>
   <div class="row" style="margin-top:6px"><a class="btn wa" id="wab" target="_blank" rel="noopener" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.1-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.8 11.9 11.9 0 004.6 4.1c1.7.7 2.4.8 3.2.7a2.7 2.7 0 001.8-1.3 2.2 2.2 0 00.2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>Confirm on WhatsApp</a></div></form></div></section>

 <section id="thanks" class="dark thanks"><div>
  <p class="cap">With love &amp; gratitude</p><h2>Thank You</h2>${orn}
  <p style="max-width:360px;margin:0 auto 16px">${esc(C.thanks)}</p>
  <p class="script" style="font-size:44px">${esc(b.name)} &amp; ${esc(g.name)}</p>
  <p class="cap" style="margin-top:10px">${esc(C.hashtag)}</p>
  <div class="row"><a class="btn ghost" href="#hero">Back to Top</a></div></div></section>`;

 const nav=[['hero','Invite'],['couple','Couple'],['countdown','Countdown'],...C.events.map(e=>[e.id,e.title]),['venue','Map'],['rsvp','RSVP'],['thanks','Thanks']];
 $('#nav').innerHTML=nav.map(n=>`<a href="#${n[0]}">${esc(n[1])}</a>`).join('');
 $('#hintTxt').textContent='A wedding invitation awaits';
 $('#eN').textContent=b.name+' & '+g.name; $('#eD').textContent=fmtD(w,{day:'numeric',month:'long',year:'numeric'}).toUpperCase();
 $('#seal').textContent=b.name[0]+'&'+g.name[0];
}
build();

/* countdown */
(function(){const t=new Date(C.weddingDate).getTime(),p=n=>String(n).padStart(2,'0');
 function tick(){let d=t-Date.now();if(d<=0){['d','h','m','s'].forEach(k=>$('#cd'+k).textContent='00');$('#cdmsg').textContent='Today we celebrate!';return}
  $('#cdd').textContent=p(Math.floor(d/864e5));$('#cdh').textContent=p(Math.floor(d%864e5/36e5));$('#cdm').textContent=p(Math.floor(d%36e5/6e4));$('#cds').textContent=p(Math.floor(d%6e4/1e3))}
 tick();setInterval(()=>{if(!document.hidden)tick()},1000)})();

/* reveal on scroll (photos) */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2});
$$('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%3)*.12+'s';io.observe(el)});

/* active nav chip */
const links=$$('#nav a'),so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('act',l.hash==='#'+e.target.id));const a=$('#nav a.act');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}}),{rootMargin:'-45% 0px -50% 0px'});
$$('section[id]').forEach(s=>so.observe(s));



/* WhatsApp RSVP: the button is a real link, rebuilt whenever the form changes */
const rf=$('#rf');
function waLink(){const yes=rf.att.value!=='no',nm=$('#rn').value.trim(),note=$('#rm').value.trim(),evs=$$('input[name=ev]:checked').map(i=>i.value).join(', ');
 $('#evb').style.display=yes?'':'none';
 const msg=(yes?C.rsvpYes:C.rsvpNo).replace('{from}',nm?'This is '+nm+'. ':'').replace('{events}',yes&&evs?'Events: '+evs+'. ':'').replace('{note}',note?'Message: '+note:'').trim();
 $('#wab').href='https://wa.me/'+C.whatsappNumber+'?text='+encodeURIComponent(msg)}
rf.addEventListener('input',waLink);rf.addEventListener('change',waLink);rf.onsubmit=e=>e.preventDefault();waLink();

/* particles + petals (single canvas, paused when hidden) */
const cv=$('#fx'),cx=cv.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,P=[];const dpr=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();
const mk=(init)=>{const petal=Math.random()<.3;return{x:Math.random()*W,y:init?Math.random()*H:-20,r:petal?5+Math.random()*5:.8+Math.random()*1.8,vy:.25+Math.random()*(petal?.8:.5),vx:(Math.random()-.5)*.4,a:Math.random()*6.28,va:(Math.random()-.5)*.03,petal,o:.35+Math.random()*.55,t:Math.random()*6}};
const N=reduce?0:(W<600?34:60);for(let i=0;i<N;i++)P.push(mk(true));
function draw(){requestAnimationFrame(draw);if(document.hidden)return;cx.clearRect(0,0,W,H);
 for(const p of P){p.y+=p.vy;p.t+=.02;p.x+=p.vx+Math.sin(p.t)*.35;p.a+=p.va;if(p.y>H+20||p.x<-30||p.x>W+30)Object.assign(p,mk(false));
  cx.globalAlpha=p.o;cx.save();cx.translate(p.x,p.y);
  if(p.petal){cx.rotate(p.a);cx.fillStyle=p.r>7?'#c2334d':'#e8a0aa';cx.beginPath();cx.ellipse(0,0,p.r,p.r*.55,0,0,6.28);cx.fill()}
  else{cx.fillStyle='#f1dc9e';cx.shadowColor='#d8b76a';cx.shadowBlur=6;cx.beginPath();cx.arc(0,0,p.r*(.7+.3*Math.sin(p.t*3)),0,6.28);cx.fill()}
  cx.restore()}cx.globalAlpha=1}
if(!reduce)draw();

/* music: built-in soft Indian-scale melody (starts only after a tap) */
const mus=$('#mus');let ac,master,playing=false,timer,audioEl;
function startSynth(){
 if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;
  const dl=ac.createDelay();dl.delayTime.value=.42;const fb=ac.createGain();fb.gain.value=.38;dl.connect(fb);fb.connect(dl);master.connect(dl);dl.connect(ac.destination);master.connect(ac.destination);
  [130.8,196].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(master);o.start()});
  const sc=[261.6,293.7,329.6,392,440,523.3,440,392,329.6,293.7];let k=0;
  const note=()=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime,f=sc[k++%sc.length];o.type='triangle';o.frequency.value=f;
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.13,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+1.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+1.7)};
  timer=setInterval(()=>{if(playing)note()},1100)}
 ac.resume();master.gain.cancelScheduledValues(ac.currentTime);master.gain.linearRampToValueAtTime(C.musicVolume,ac.currentTime+1.5)}
function setMusic(on){playing=on;mus.classList.toggle('on',on);mus.textContent=on?'❚❚':'♪';
 if(C.musicUrl){if(!audioEl){audioEl=new Audio(C.musicUrl);audioEl.loop=true;audioEl.volume=C.musicVolume}on?audioEl.play().catch(()=>{}):audioEl.pause()}
 else if(on)startSynth();else if(ac)master.gain.linearRampToValueAtTime(0,ac.currentTime+.6)}
/* music player: tracks, play/pause, mute, volume (starts only on Play) */
const tr=C.musicTracks,pl=$('#pl');let cur=0,muted=false,vol=C.musicVolume,on=false,ctx,out,tm,dr=[],au;
$('#tl').innerHTML=tr.map((t,i)=>`<button class="tk" data-i="${i}" aria-pressed="${i===0}">${esc(t.name)} – ${esc(t.note||'')}</button>`).join('');
$('#vl').value=vol*100;
function setVol(){if(out)out.gain.setTargetAtTime(muted?0:vol,ctx.currentTime,.1);if(au){au.muted=muted;au.volume=vol}}
function stopSynth(){clearInterval(tm);dr.forEach(o=>{try{o.stop()}catch(e){}});dr=[]}
function synth(t){
 if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();out=ctx.createGain();const dl=ctx.createDelay(),fb=ctx.createGain();dl.delayTime.value=.42;fb.gain.value=.36;out.connect(ctx.destination);out.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ctx.destination)}
 ctx.resume();setVol();
 dr=[t.drone,t.drone*1.5].map(f=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(out);o.start();return o});
 let k=0;const n=()=>{if(!on)return;const o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.currentTime;o.type=t.wave;o.frequency.value=t.scale[k++%t.scale.length];g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.13,s+.03);g.gain.exponentialRampToValueAtTime(.001,s+t.decay);o.connect(g);g.connect(out);o.start(s);o.stop(s+t.decay+.1)};
 n();tm=setInterval(n,t.gap*1000)}
function ui(){mus.classList.toggle('on',on);mus.textContent=muted?'🔇':(on?'♪':'♪');$('#pp').textContent=on?'Pause':'Play';$('#mt').textContent=muted?'Unmute':'Mute';$$('.tk').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===cur));$('#plh').textContent=on?(muted?'Muted – tap Unmute to hear it.':'Now playing: '+tr[cur].name):'Choose a song, then tap Play. Music stays on while you scroll.'}
function start(){on=true;stopSynth();if(au){au.pause();au=null}const t=tr[cur];
 if(t.url){au=new Audio(t.url);au.loop=true;au.volume=vol;au.muted=muted;au.play().catch(()=>{})}else synth(t);ui()}
function stop(){on=false;stopSynth();if(au)au.pause();ui()}
$('#pp').onclick=()=>on?stop():start();
$('#mt').onclick=()=>{muted=!muted;setVol();ui()};
$('#vl').oninput=e=>{vol=e.target.value/100;if(vol>0&&muted)muted=false;setVol();ui()};
$$('.tk').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;on?start():ui()});
mus.onclick=e=>{e.stopPropagation();const o=pl.classList.toggle('on');mus.setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!pl.contains(e.target)&&e.target!==mus){pl.classList.remove('on');mus.setAttribute('aria-expanded','false')}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&on&&ctx)ctx.resume()});

/* open invitation */
function openInv(){if(document.body.classList.contains('opened'))return;
 document.body.classList.add('opened');$('#intro').classList.add('opened');document.body.classList.add('hintshow');
 setTimeout(()=>{$('#intro').classList.add('done');document.body.classList.remove('lock','pre');document.body.classList.add('go');scrollTo(0,0)},2600)}
$('#openBtn').onclick=openInv;$('#seal').onclick=openInv;
</script>
</body>
</html>
