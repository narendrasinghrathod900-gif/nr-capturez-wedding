
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NR CAPTUREZ Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f5f1eb;color:#30251f;font-family:Arial}
header{background:#401522;color:#e9d5a2;padding:22px}
main{max-width:700px;margin:25px auto;padding:15px}
section{background:white;padding:20px;margin:16px 0;border-radius:12px}
input,select,button{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:7px;font-size:16px;box-sizing:border-box}
button{background:#401522;color:white;border:0;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h2>NR CAPTUREZ</h2>
<p>Private Wedding Card Admin Panel</p>
</header>
<main>
<section id="login">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</section>
<div id="panel" class="hidden">
<section>
<h3>Welcome Admin</h3>
<button onclick="logout()">Logout</button>
</section>
<section>
<h3>Available Designs</h3>
<div id="designs">Loading...</div>
</section>
<section>
<h3>Add New Customer</h3>
<input id="customerName" placeholder="Customer Name">
<input id="customerPhone" placeholder="Phone Number">
<input id="customerEmail" type="email" placeholder="Email (optional)">
<input id="customerNotes" placeholder="Notes (optional)">
<button onclick="addCustomer()">Save Customer</button>
</section>
<section>
<h3>Create Wedding Card</h3>
<select id="customerSelect"><option value="">Select Customer</option></select>
<input id="slug" placeholder="Unique card link name">
<select id="designSelect"><option value="">Select Design</option></select>
<button onclick="createCard()">Create Draft</button>
</section>
<section>
<h3>Your Wedding Cards</h3>
<div id="cards">Loading...</div>
</section>
<p id="message"></p>
  
<section>
  <h3>Edit Wedding Card</h3>

  <select id="editCardSelect">
    <option value="">Select Wedding Card</option>
  </select>

  <input id="groomName" placeholder="Groom Name">
  <input id="brideName" placeholder="Bride Name">
  <input id="weddingDate" type="date">
  <input id="weddingVenue" placeholder="Wedding Venue">
  <input id="weddingTime" placeholder="Wedding Time">

  <h4>Wedding Events</h4>
  <input id="mehndi" placeholder="Mehndi Details">
  <input id="haldi" placeholder="Haldi Details">
  <input id="nikasi" placeholder="Nikasi Details">
  <input id="reception" placeholder="Reception Details">

  <input id="mapLink" placeholder="Google Maps Link">
  <input id="whatsapp" placeholder="WhatsApp Number">
<h4>Bride & Groom Photos</h4>

<label>Groom Photo</label>
<input id="groomPhoto" type="file" accept="image/*">

<label>Bride Photo</label>
<input id="bridePhoto" type="file" accept="image/*">

<h4>Wedding Events</h4>
<div id="eventList"></div>

<button type="button" onclick="addEventRow()">+ Add Wedding Event</button>
  <button onclick="saveCardDetails()">Save Wedding Details</button>
<button type="button" onclick="publishSelectedCard()">Publish Wedding Card</button>
  <p id="editMessage"></p>
</section>

</div>
</main>
  
<script>
const SUPABASE_URL = "https://erzgumxrxcbkfvwagnpj.supabase.co";
const SUPABASE_KEY = "sb_publishable_lxTmzwIrexM_Oew2q1iI1g_i4-RaHEr";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    showMessage("Login error: " + error.message);
    return;
  }

  currentUser = data.user;

  const { data: admin, error: adminError } = await db
    .from("admins")
    .select("user_id")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if (adminError || !admin) {
    await db.auth.signOut();
    showMessage("Access denied. Admin account only.");
    return;
  }

  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");

  showMessage("Welcome to NR CAPTUREZ Admin Panel!");

  await loadDesigns();
  await loadCustomers();
  await loadCards();
  await loadEditableCards();
}

async function loadDesigns() {
  const { data, error } = await db
    .from("designs")
    .select("id,name,active")
    .eq("active", true)
    .order("name");

  if (error) {
    showMessage(error.message);
    return;
  }

  document.getElementById("designs").innerHTML =
    data.map(item => "<p>" + item.name + "</p>").join("");

  document.getElementById("designSelect").innerHTML =
    '<option value="">Select Design</option>' +
    data.map(item =>
      '<option value="' + item.id + '">' + item.name + '</option>'
    ).join("");
}

async function loadCustomers() {
  const { data, error } = await db
    .from("customers")
    .select("id,name,phone")
    .order("created_at", { ascending: false });

  if (error) {
    showMessage(error.message);
    return;
  }

  document.getElementById("customerSelect").innerHTML =
    '<option value="">Select Customer</option>' +
    data.map(item =>
      '<option value="' + item.id + '">' +
      item.name + ' - ' + (item.phone || "") +
      '</option>'
    ).join("");
}

async function addCustomer() {
  const name = document.getElementById("customerName").value.trim();

  if (!name) {
    showMessage("Please enter customer name.");
    return;
  }

  const { error } = await db.from("customers").insert({
    name: name,
    phone: document.getElementById("customerPhone").value.trim() || null,
    email: document.getElementById("customerEmail").value.trim() || null,
    notes: document.getElementById("customerNotes").value.trim() || null
  });

  if (error) {
    showMessage("Customer error: " + error.message);
    return;
  }

  showMessage("Customer saved successfully.");

  ["customerName", "customerPhone", "customerEmail", "customerNotes"]
    .forEach(id => document.getElementById(id).value = "");

  await loadCustomers();
}

async function createCard() {
  const customer_id = document.getElementById("customerSelect").value;
  const slug = document.getElementById("slug").value.trim().toLowerCase();
  const design = document.getElementById("designSelect").value;

  if (!customer_id || !slug || !design) {
    showMessage("Select customer, design and enter card link name.");
    return;
  }

  if (!/^[a-z0-9-]+$/.test(slug)) {
    showMessage("Use lowercase English letters, numbers and hyphens only.");
    return;
  }

  const { error } = await db.from("cards").insert({
    customer_id: customer_id,
    slug: slug,
    design: design,
    status: "draft",
    locked: false,
    data: {}
  });

  if (error) {
    showMessage("Card error: " + error.message);
    return;
  }

  showMessage("Wedding card draft created successfully.");

  document.getElementById("slug").value = "";
  await loadCards();
}

async function loadCards() {
  const { data, error } = await db
    .from("cards")
    .select("id,slug,design,status,locked")
    .order("created_at", { ascending: false });

  if (error) {
    showMessage("Cards error: " + error.message);
    return;
  }

  document.getElementById("cards").innerHTML =
    data.length
      ? data.map(item =>
          "<p><b>" + item.slug + "</b><br>" +
          "Design: " + item.design + "<br>" +
          "Status: " + item.status + "<br>" +
          "Locked: " + item.locked + "</p>"
        ).join("")
      : "No cards created yet.";
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

db.auth.getSession().then(async ({ data }) => {
  if (data.session) {
    currentUser = data.session.user;
    await loginWithExistingSession();
  }
});

async function loginWithExistingSession() {
  const { data: admin } = await db
    .from("admins")
    .select("user_id")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if (!admin) {
    await db.auth.signOut();
    return;
  }

  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  showMessage("Welcome to NR CAPTUREZ Admin Panel!");

  await loadDesigns();
  await loadCustomers();
  await loadCards();
  await loadEditableCards();
}
  
async function loadEditableCards() {
  const { data, error } = await db
    .from("cards")
    .select("id,slug")
    .order("created_at", { ascending: false });

  if (error) {
    showMessage("Edit cards error: " + error.message);
    return;
  }

  const select = document.getElementById("editCardSelect");

  select.innerHTML =
    '<option value="">Select Wedding Card</option>' +
    data.map(card =>
      '<option value="' + card.id + '">' + card.slug + '</option>'
    ).join("");

  select.onchange = loadSelectedCard;
}

async function loadSelectedCard() {
  const id = document.getElementById("editCardSelect").value;

  if (!id) return;

  const { data: card, error } = await db
    .from("cards")
    .select("data")
    .eq("id", id)
    .single();

  if (error) {
    showMessage("Load card error: " + error.message);
    return;
  }

  const details = card.data || {};

  document.getElementById("groomName").value = details.groomName || "";
  document.getElementById("brideName").value = details.brideName || "";
  document.getElementById("weddingDate").value = details.weddingDate || "";
  document.getElementById("weddingVenue").value = details.weddingVenue || "";
  document.getElementById("weddingTime").value = details.weddingTime || "";
  document.getElementById("mehndi").value = details.mehndi || "";
  document.getElementById("haldi").value = details.haldi || "";
  document.getElementById("nikasi").value = details.nikasi || "";
  document.getElementById("reception").value = details.reception || "";
  document.getElementById("mapLink").value = details.mapLink || "";
  document.getElementById("whatsapp").value = details.whatsapp || "";
}

async function saveCardDetails() {
  const id = document.getElementById("editCardSelect").value;

  if (!id) {
    document.getElementById("editMessage").textContent =
      "Please select a wedding card.";
    return;
  }

  const details = {
    groomName: document.getElementById("groomName").value.trim(),
    brideName: document.getElementById("brideName").value.trim(),
    weddingDate: document.getElementById("weddingDate").value,
    weddingVenue: document.getElementById("weddingVenue").value.trim(),
    weddingTime: document.getElementById("weddingTime").value.trim(),
    mehndi: document.getElementById("mehndi").value.trim(),
    haldi: document.getElementById("haldi").value.trim(),
    nikasi: document.getElementById("nikasi").value.trim(),
    reception: document.getElementById("reception").value.trim(),
    mapLink: document.getElementById("mapLink").value.trim(),
    whatsapp: document.getElementById("whatsapp").value.trim()
  };

  const { error } = await db
    .from("cards")
    .update({ data: details })
    .eq("id", id);

  if (error) {
    document.getElementById("editMessage").textContent =
      "Save error: " + error.message;
    return;
  }

  document.getElementById("editMessage").textContent =
    "Wedding details saved successfully!";
}
  function addEventRow() {
  const eventList = document.getElementById("eventList");

  const row = document.createElement("div");

  row.innerHTML = `
    <input type="text" placeholder="Event Name">
    <input type="text" placeholder="Event Details">
    <button type="button" onclick="this.parentElement.remove()">
      Remove Event
    </button>
  `;

  eventList.appendChild(row);
}
  function addEventRow(eventName = "", eventDetails = "") {
  const eventList = document.getElementById("eventList");
  const row = document.createElement("div");

  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.placeholder = "Event Name";
  nameInput.value = eventName;

  const detailsInput = document.createElement("input");
  detailsInput.type = "text";
  detailsInput.placeholder = "Event Details";
  detailsInput.value = eventDetails;

  const removeButton = document.createElement("button");
  removeButton.type = "button";
  removeButton.textContent = "Remove Event";
  removeButton.onclick = () => row.remove();

  row.append(nameInput, detailsInput, removeButton);
  eventList.appendChild(row);
}

async function loadSelectedCard() {
  const id = document.getElementById("editCardSelect").value;
  if (!id) return;

  const { data: card, error } = await db
    .from("cards")
    .select("data")
    .eq("id", id)
    .single();

  if (error) {
    showMessage("Load card error: " + error.message);
    return;
  }

  const details = card.data || {};

  document.getElementById("groomName").value = details.groomName || "";
  document.getElementById("brideName").value = details.brideName || "";
  document.getElementById("weddingDate").value = details.weddingDate || "";
  document.getElementById("weddingVenue").value = details.weddingVenue || "";
  document.getElementById("weddingTime").value = details.weddingTime || "";
  document.getElementById("mehndi").value = details.mehndi || "";
  document.getElementById("haldi").value = details.haldi || "";
  document.getElementById("nikasi").value = details.nikasi || "";
  document.getElementById("reception").value = details.reception || "";
  document.getElementById("mapLink").value = details.mapLink || "";
  document.getElementById("whatsapp").value = details.whatsapp || "";

  const eventList = document.getElementById("eventList");
  eventList.innerHTML = "";

  (details.events || []).forEach(event => {
    addEventRow(event.name || "", event.details || "");
  });
}

async function saveCardDetails() {
  const id = document.getElementById("editCardSelect").value;

  if (!id) {
    document.getElementById("editMessage").textContent =
      "Please select a wedding card.";
    return;
  }

  const eventRows = document.querySelectorAll("#eventList > div");

  const events = Array.from(eventRows).map(row => ({
    name: row.querySelectorAll("input")[0].value.trim(),
    details: row.querySelectorAll("input")[1].value.trim()
  }));

  const details = {
    groomName: document.getElementById("groomName").value.trim(),
    brideName: document.getElementById("brideName").value.trim(),
    weddingDate: document.getElementById("weddingDate").value,
    weddingVenue: document.getElementById("weddingVenue").value.trim(),
    weddingTime: document.getElementById("weddingTime").value.trim(),
    mehndi: document.getElementById("mehndi").value.trim(),
    haldi: document.getElementById("haldi").value.trim(),
    nikasi: document.getElementById("nikasi").value.trim(),
    reception: document.getElementById("reception").value.trim(),
    mapLink: document.getElementById("mapLink").value.trim(),
    whatsapp: document.getElementById("whatsapp").value.trim(),
    events: events
  };

  const { error } = await db
    .from("cards")
    .update({ data: details })
    .eq("id", id);

  if (error) {
    document.getElementById("editMessage").textContent =
      "Save error: " + error.message;
    return;
  }

  document.getElementById("editMessage").textContent =
    "Wedding details saved successfully!";
}
  
async function saveCardDetails() {
  const id = document.getElementById("editCardSelect").value;
  const msg = document.getElementById("editMessage");

  if (!id) {
    msg.textContent = "Please select a wedding card.";
    return;
  }

  msg.textContent = "Saving wedding details and photos...";

  const { data: oldCard, error: fetchError } = await db
    .from("cards")
    .select("data")
    .eq("id", id)
    .single();

  if (fetchError) {
    msg.textContent = "Error loading card: " + fetchError.message;
    return;
  }

  const groomFile = document.getElementById("groomPhoto").files[0];
  const brideFile = document.getElementById("bridePhoto").files[0];

  const photos = { ...(oldCard.data?.photos || {}) };

  const allowedTypes = ["image/jpeg", "image/png", "image/webp"];

  async function uploadPhoto(file, person) {
    if (!file) return photos[person];

    if (!allowedTypes.includes(file.type)) {
      throw new Error("Please use JPG, PNG or WEBP photos.");
    }

    if (file.size > 5 * 1024 * 1024) {
      throw new Error("Each photo must be smaller than 5 MB.");
    }

    const extension = {
      "image/jpeg": "jpg",
      "image/png": "png",
      "image/webp": "webp"
    }[file.type];

    const path = id + "/" + person + "-" +
      Date.now() + "-" + Math.random().toString(36).slice(2) +
      "." + extension;

    const { error } = await db.storage
      .from("card-photos")
      .upload(path, file, {
        contentType: file.type,
        upsert: false
      });

    if (error) throw error;

    return path;
  }

  try {
    photos.groom = await uploadPhoto(groomFile, "groom");
    photos.bride = await uploadPhoto(brideFile, "bride");

    const eventRows = document.querySelectorAll("#eventList > div");

    const events = Array.from(eventRows).map(row => ({
      name: row.querySelectorAll("input")[0].value.trim(),
      detail: row.querySelectorAll("input")[1].value.trim()
    }));

    const details = {
      groomName: document.getElementById("groomName").value.trim(),
      brideName: document.getElementById("brideName").value.trim(),
      weddingDate: document.getElementById("weddingDate").value,
      weddingVenue: document.getElementById("weddingVenue").value.trim(),
      weddingTime: document.getElementById("weddingTime").value.trim(),
      mehndi: document.getElementById("mehndi").value.trim(),
      haldi: document.getElementById("haldi").value.trim(),
      nikasi: document.getElementById("nikasi").value.trim(),
      reception: document.getElementById("reception").value.trim(),
      mapLink: document.getElementById("mapLink").value.trim(),
      whatsapp: document.getElementById("whatsapp").value.trim(),
      events: events,
      photos: photos
    };

    const { error } = await db
      .from("cards")
      .update({ data: details })
      .eq("id", id);

    if (error) throw error;

    msg.textContent = "Wedding details and photo paths saved successfully!";
  } catch (error) {
    msg.textContent = "Save error: " + error.message;
  }
}

async function publishSelectedCard() {
  const id = document.getElementById("editCardSelect").value;
  const msg = document.getElementById("editMessage");

  if (!id) {
    msg.textContent = "Please select a wedding card.";
    return;
  }

  if (!confirm("Are you sure you want to publish this wedding card?")) {
    return;
  }

  msg.textContent = "Publishing wedding card...";

  const { error } = await db.rpc("publish_card", {
    p_id: id
  });

  if (error) {
    msg.textContent = "Publish error: " + error.message;
    return;
  }

  msg.textContent = "Wedding card published successfully!";
}  

</script>
</body>
</html>
